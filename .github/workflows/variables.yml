name: Greeting on variable day

on:
  workflow_dispatch

# Global level variable
env:
  DAY_OF_WEEK: Monday

jobs:
  greeting_job:
    runs-on: ubuntu-latest
# Job level variable
    env:
      Greeting: Hello 
    steps:
      - name: "Say Hello Mona it's Monday"
        run: echo "$Greeting $First_Name. Today is $DAY_OF_WEEK!"
        
      - name: "Tell the project name"
        run: echo "Your project ID is ${{vars.PROJECT_ID}}"
        # Step level variable
        env:
          First_Name: Mona
